<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"><meta name="theme-color" content="#253b46"><title>Roadster</title><link rel="icon" href="./favicon.svg"></head><body>
<canvas id="roadster-canvas" aria-label="滨海立交试驾区" tabindex="-1"></canvas>
<main id="roadster-hud"><button id="roadster-pause" aria-label="暂停">Ⅱ</button><div id="roadster-forecast" hidden></div><div id="roadster-tip"></div><div class="roadster-dashboard"><div><strong id="roadster-speed">0</strong><small>km/h</small></div><div class="roadster-pressure"><span>气压</span><b id="roadster-pressure">100</b><i><em id="roadster-pressure-fill"></em></i></div><div id="roadster-height" hidden></div></div><div id="roadster-contact" hidden></div></main>
<div id="roadster-touch"><div id="roadster-stick" role="group" aria-label="左摇杆：向前油门，向后制动，左右方向"><span class="up" aria-hidden="true">⌃</span><span class="left" aria-hidden="true">‹</span><span class="right" aria-hidden="true">›</span><span class="down" aria-hidden="true">⌄</span><i></i></div><button id="roadster-jet" aria-label="按住喷气抬升">↑ <span>喷气</span></button></div>
<section id="roadster-menu"><div><h1>Roadster</h1><button id="roadster-start" disabled>载入场地…</button><p id="roadster-menu-help">W 油门 · S 制动 · A D 方向 · 空格喷气</p><a href="./index.html">旧版试验场</a></div></section>
<section id="roadster-overlay" hidden><div><h2>已暂停</h2><p id="roadster-help">W油门，A/D方向，持续S制动并倒车。空中S反推减速，空格持续抬升。</p><label><input id="roadster-sound" type="checkbox" checked>声音</label><nav><button id="roadster-resume">继续</button><button id="roadster-reset">复位</button><button id="roadster-restart">重开</button><button id="roadster-menu-button">主菜单</button></nav></div></section>
<section id="roadster-finish" hidden><div><h2>抵达出口</h2><button id="roadster-again">再开一次</button><button id="roadster-finish-menu">主菜单</button></div></section>
<section id="roadster-rotate" hidden><div>请横屏驾驶</div></section><div id="roadster-error" hidden></div>
<script type="module" src="/src/roadster/main.js"></script></body></html>
